name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aster
          POSTGRES_PASSWORD: aster
          POSTGRES_DB: aster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aster -d aster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install Aster
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest
      - name: Initialize live database
        env:
          PGPASSWORD: aster
        run: psql -h localhost -U aster -d aster -v ON_ERROR_STOP=1 -f docker/init.sql
      - name: Live candidate collection smoke test
        run: python scripts/live_smoke.py
